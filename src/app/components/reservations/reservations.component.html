<!-- ==========================================================================
     6. TABLE RESERVATIONS DEDICATED PAGE VIEW
     ========================================================================== -->
<section class="reservation-editorial-wrapper" id="reservations-section">
  <div class="container">
    <div class="reservation-luxury-panel">
      <div class="panel-background-media">
        <img src="/images/reservation-table.jpg" alt="Luxury candlelit table at D'Molto Neapolitan Pizzeria" class="panel-bg-photo">
        <div class="panel-gradient-veil"></div>
      </div>

      <div class="panel-content-grid">
        <div class="panel-form-col">
          <span class="editorial-kicker text-gold">JOIN US AT THE TABLE</span>
          <h2 class="panel-heading font-serif">Reserve Your <span class="text-orange">Experience</span></h2>
          <p class="panel-subtext">
            Whether it's an intimate date night, family celebration, or casual gathering, reserve your table for live oven-side seating.
          </p>

          <form (submit)="submitReservation($event)" class="modal-luxury-form">
            <div class="form-inputs-grid">
              <div class="input-block">
                <label>Full Name *</label>
                <input type="text" [(ngModel)]="resName" name="resName" placeholder="e.g. Marco Rossi" required>
              </div>
              <div class="input-block">
                <label>Phone Number *</label>
                <input type="tel" [(ngModel)]="resPhone" name="resPhone" placeholder="e.g. +91 98765 43210" required>
              </div>
              <div class="input-block">
                <label>Party Size</label>
                <select [(ngModel)]="resGuests" name="resGuests">
                  <option value="1 Guest">1 Guest (Solo Dining)</option>
                  <option value="2 Guests">2 Guests (Couple Table)</option>
                  <option value="4 Guests">4 Guests (Family Table)</option>
                  <option value="6 Guests">6 Guests (Party Booth)</option>
                  <option value="8+ Guests">8+ Guests (Large Group)</option>
                </select>
              </div>
              <div class="input-block">
                <label>Date *</label>
                <input type="date" [(ngModel)]="resDate" name="resDate" required>
              </div>
              <div class="input-block" style="grid-column: span 2;">
                <label>Preferred Time *</label>
                <select [(ngModel)]="resTime" name="resTime">
                  <option value="12:30 PM">12:30 PM (Lunch)</option>
                  <option value="01:30 PM">01:30 PM (Lunch)</option>
                  <option value="07:00 PM">07:00 PM (Dinner)</option>
                  <option value="07:30 PM">07:30 PM (Dinner Prime)</option>
                  <option value="08:30 PM">08:30 PM (Dinner Rush)</option>
                  <option value="09:30 PM">09:30 PM (Late Feast)</option>
                </select>
              </div>
            </div>

            <div class="input-block" style="margin-bottom: 20px;">
              <label>Special Requests or Dietary Notes</label>
              <textarea [(ngModel)]="resNotes" name="resNotes" rows="2" placeholder="Window booth preferred, birthday cake setup..."></textarea>
            </div>

            <button type="submit" class="btn-pill-terracotta btn-full-width">
              <span>Confirm Reservation via WhatsApp</span>
              <span>→</span>
            </button>
          </form>
        </div>

        <div class="script-card-floating">
          <span class="script-annotation text-gold">A Warm Table<br>Awaits You</span>
          <div class="script-decorative-leaf">🌿</div>
        </div>
      </div>
    </div>
  </div>
</section>
